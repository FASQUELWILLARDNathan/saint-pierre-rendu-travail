# HTTP → HTTPS
server {
    listen 80;
    server_name cssaintpierrecalais.fr www.cssaintpierrecalais.fr;

    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name cssaintpierrecalais.fr www.cssaintpierrecalais.fr;

    ssl_certificate /etc/letsencrypt/live/www.cssaintpierrecalais.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.cssaintpierrecalais.fr/privkey.pem;

    # FRONTEND
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # BACKEND
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    client_max_body_size 20M;
}