                  type: string
                  pattern: '^[0-9]+$'
                  nullable: true
                id_option:
                  type: string
                  pattern: '^[0-9]+$'
                  nullable: true
                fichiers:
                  type: array
                  items:
                    type: string
                    format: binary
              required: [nom_cours, id_matiere]
              oneOf:
                - required: [id_matiere]
                - required: [id_specialite]
                - required: [id_option]
      responses:
        '201':
          description: Cours créé
          content:
