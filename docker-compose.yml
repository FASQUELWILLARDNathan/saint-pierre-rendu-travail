services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: saint-pierre-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: saint-pierre-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}
      NODE_ENV: ${NODE_ENV}
      PORT: ${API_PORT}
    ports:
      - '${API_PORT}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm run prisma:setup && npm run dev:api"

  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: saint-pierre-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - '${FRONTEND_PORT}:5173'
    depends_on:
      - backend
    networks:
      - app-network
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
