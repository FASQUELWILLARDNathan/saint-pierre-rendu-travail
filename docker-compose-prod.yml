services:
  postgres:
    image: postgres:16-alpine
    container_name: saint-pierre-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend

    container_name: saint-pierre-backend

    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}

    ports:
      - '${API_PORT}:3000'

    depends_on:
      postgres:
        condition: service_healthy

    command: sh -c "npm run prisma:setup && node dist/index.js"

  frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend

    container_name: saint-pierre-frontend

    ports:
      - '${FRONTEND_PORT}:80'

    depends_on:
      - backend

volumes:
  postgres_data: